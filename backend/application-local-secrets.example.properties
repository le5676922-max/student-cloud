# Optional development-only configuration, outside src/main/resources.
# Copy to application-local-secrets.properties (gitignored); never publish that file.
# In Docker/production use STUDENT_CLOUD_DB_PASSWORD instead, with no local secrets file.
spring.datasource.password=replace-with-your-mysql-password

# QQ mailbox: enable SMTP and create an authorization code in QQ mailbox settings.
# Copy these to the ignored application-local-secrets.properties, then restart the backend.
tongligong-student-cloud.registration.mail.enabled=true
tongligong-student-cloud.registration.mail.host=smtp.qq.com
tongligong-student-cloud.registration.mail.port=465
tongligong-student-cloud.registration.mail.username=your-account@qq.com
tongligong-student-cloud.registration.mail.password=replace-with-qq-authorization-code
tongligong-student-cloud.registration.mail.from=your-account@qq.com
tongligong-student-cloud.registration.mail.ssl=true
tongligong-student-cloud.registration.mail.starttls=false
tongligong-student-cloud.registration.mail.code-secret=replace-with-a-random-secret-at-least-32-characters
