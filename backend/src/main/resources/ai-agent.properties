# AI Agent 配置。密钥只从环境变量读取，不要写入代码仓库。
tongligong-student-cloud.ai.enabled=${TLGXY_CLOUD_AI_ENABLED:true}
tongligong-student-cloud.ai.api-key=${DEEPSEEK_API_KEY:${TLGXY_CLOUD_AI_API_KEY:}}
tongligong-student-cloud.ai.base-url=${TLGXY_CLOUD_AI_BASE_URL:https://api.deepseek.com}
tongligong-student-cloud.ai.model=${TLGXY_CLOUD_AI_MODEL:deepseek-flash}
# Flash 默认使用非思考模式，降低站内操作问答的首字延迟。
tongligong-student-cloud.ai.thinking-enabled=${TLGXY_CLOUD_AI_THINKING_ENABLED:false}
tongligong-student-cloud.ai.max-tokens=${TLGXY_CLOUD_AI_MAX_TOKENS:2048}
tongligong-student-cloud.ai.timeout-seconds=${TLGXY_CLOUD_AI_TIMEOUT_SECONDS:45}
tongligong-student-cloud.ai.max-history=${TLGXY_CLOUD_AI_MAX_HISTORY:8}
tongligong-student-cloud.ai.max-tool-rounds=${TLGXY_CLOUD_AI_MAX_TOOL_ROUNDS:4}
