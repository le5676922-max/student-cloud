tongligong-student-cloud.demo-site=false
tongligong-student-cloud.db.version=4.5.0

# Configure your own third-party application credentials if these storage drivers are used.
tongligong-student-cloud.onedrive.clientId=${TLGXY_CLOUD_ONEDRIVE_CLIENT_ID:}
tongligong-student-cloud.onedrive.clientSecret=${TLGXY_CLOUD_ONEDRIVE_CLIENT_SECRET:}
tongligong-student-cloud.onedrive.redirectUri=${TLGXY_CLOUD_ONEDRIVE_REDIRECT_URI:}
tongligong-student-cloud.onedrive.scope=offline_access User.Read Files.ReadWrite.All Sites.Read.All Sites.ReadWrite.All

tongligong-student-cloud.onedrive-china.clientId=${TLGXY_CLOUD_ONEDRIVE_CHINA_CLIENT_ID:}
tongligong-student-cloud.onedrive-china.clientSecret=${TLGXY_CLOUD_ONEDRIVE_CHINA_CLIENT_SECRET:}
tongligong-student-cloud.onedrive-china.redirectUri=${TLGXY_CLOUD_ONEDRIVE_CHINA_REDIRECT_URI:}
tongligong-student-cloud.onedrive-china.scope=offline_access User.Read Files.ReadWrite.All Sites.Read.All Sites.ReadWrite.All

tongligong-student-cloud.gd.clientId=${TLGXY_CLOUD_GD_CLIENT_ID:}
tongligong-student-cloud.gd.clientSecret=${TLGXY_CLOUD_GD_CLIENT_SECRET:}
tongligong-student-cloud.gd.redirectUri=${TLGXY_CLOUD_GD_REDIRECT_URI:}
tongligong-student-cloud.gd.scope=https://www.googleapis.com/auth/drive

tongligong-student-cloud.open115.appId=${TLGXY_CLOUD_OPEN115_APP_ID:}

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8
spring.web.resources.chain.compressed=true

mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.mapper-locations=classpath*:mapper/*.xml,classpath*:com/gitee/sunchenbin/mybatis/actable/mapping/*/*.xml

spring.flyway.clean-disabled=true
spring.flyway.enabled=true
spring.flyway.out-of-order=true
spring.flyway.ignore-migration-patterns=versioned:missing

knife4j.enable=true
knife4j.setting.enableSwaggerModels=true

sa-token.is-print=false
sa-token.token-name=tongligong-student-cloud-token
spring.main.allow-circular-references=false

spring.servlet.multipart.max-request-size=512MB
spring.servlet.multipart.max-file-size=512MB

mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
server.compression.enabled=true
tongligong-student-cloud.log.encoder=UTF-8
spring.cache.redis.time-to-live=10m
