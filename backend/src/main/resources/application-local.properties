# Self-contained development profile. Never uses the configured MySQL database.
server.address=127.0.0.1
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.url=jdbc:sqlite:${TLGXY_CLOUD_LOCAL_DATA:./.local-data}/student-cloud.db
spring.datasource.username=
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=4
tongligong-student-cloud.log.path=${TLGXY_CLOUD_LOCAL_DATA:./.local-data}/logs
spring.web.resources.static-locations=file:../frontend/dist/
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
knife4j.enable=false
