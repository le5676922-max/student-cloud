# 独立嵌入模型配置，不读取聊天模型密钥。必须是兼容标准 /embeddings 的 HTTPS 供应商。
tongligong-student-cloud.learning.embedding.enabled=${STUDENT_CLOUD_EMBEDDING_ENABLED:false}
tongligong-student-cloud.learning.embedding.base-url=${STUDENT_CLOUD_EMBEDDING_BASE_URL:}
tongligong-student-cloud.learning.embedding.api-key=${STUDENT_CLOUD_EMBEDDING_API_KEY:}
tongligong-student-cloud.learning.embedding.model=${STUDENT_CLOUD_EMBEDDING_MODEL:}
tongligong-student-cloud.learning.embedding.dimensions=${STUDENT_CLOUD_EMBEDDING_DIMENSIONS:1024}
tongligong-student-cloud.learning.embedding.timeout-seconds=${STUDENT_CLOUD_EMBEDDING_TIMEOUT_SECONDS:10}
tongligong-student-cloud.learning.embedding.max-concurrent=${STUDENT_CLOUD_EMBEDDING_MAX_CONCURRENT:2}
tongligong-student-cloud.learning.embedding.min-similarity=${STUDENT_CLOUD_EMBEDDING_MIN_SIMILARITY:0.25}
