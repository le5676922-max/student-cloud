spring.profiles.active=prod
spring.config.import=classpath:application-default.properties,optional:file:./application-local-secrets.properties,optional:file:./backend/application-local-secrets.properties

tongligong-student-cloud.debug=false
tongligong-student-cloud.log.path=${user.home}/.student-cloud/logs
tongligong-student-cloud.db.path=${user.home}/.student-cloud/db/student-cloud
# Workspace-shared Local storage, isolated by immutable tenant ID. Persist this root when using Docker.
# Example Docker value: STUDENT_CLOUD_WORKSPACE_STORAGE_ROOT=/data/workspaces (bind /data to a persistent volume).
# This is not a per-workspace capacity quota; the existing 512MB multipart file limit still applies.
tongligong-student-cloud.workspace-storage.root=${STUDENT_CLOUD_WORKSPACE_STORAGE_ROOT:${tongligong-student-cloud.log.path}/../workspaces}
tongligong-student-cloud.preview.text.maxFileSizeKb=512
tongligong-student-cloud.dbCache.enable=true

spring.web.resources.static-locations=file:static/
server.port=8080
tongligong-student-cloud.cors.allowed-origins=${TLGXY_CLOUD_CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}

# Configure credentials locally; never commit real passwords.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/student_cloud?characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${STUDENT_CLOUD_DB_USER:root}
spring.datasource.password=${STUDENT_CLOUD_DB_PASSWORD:}
mybatis-plus.type-handlers-package=im.tlgxy.cloud.core.config

# QQ SMTP: password is an authorization code, not the mailbox login password.
# Leave disabled until MAIL_USERNAME/MAIL_PASSWORD are configured. No code is exposed in HTTP/logs.
tongligong-student-cloud.registration.mail.enabled=${MAIL_ENABLED:false}
tongligong-student-cloud.registration.mail.host=${MAIL_HOST:smtp.qq.com}
tongligong-student-cloud.registration.mail.port=${MAIL_PORT:465}
tongligong-student-cloud.registration.mail.username=${MAIL_USERNAME:}
tongligong-student-cloud.registration.mail.password=${MAIL_PASSWORD:}
tongligong-student-cloud.registration.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
tongligong-student-cloud.registration.mail.auth=${MAIL_AUTH:true}
tongligong-student-cloud.registration.mail.ssl=${MAIL_SSL:true}
tongligong-student-cloud.registration.mail.starttls=${MAIL_STARTTLS:false}
tongligong-student-cloud.registration.mail.code-secret=${MAIL_CODE_SECRET:}
tongligong-student-cloud.registration.mail.max-concurrent-sends=${MAIL_MAX_CONCURRENT_SENDS:8}
tongligong-student-cloud.registration.mail.max-sends-per-minute=${MAIL_MAX_SENDS_PER_MINUTE:120}

# Private durable upload staging: keep it outside every local cloud storage root.
tongligong-student-cloud.uploads.resumable.enabled=${STUDENT_CLOUD_RESUMABLE_UPLOAD_ENABLED:true}
tongligong-student-cloud.uploads.resumable.staging-root=${STUDENT_CLOUD_UPLOAD_STAGING_ROOT:./data/upload-staging}
tongligong-student-cloud.uploads.resumable.quota-bytes=${STUDENT_CLOUD_UPLOAD_STAGING_QUOTA_BYTES:21474836480}

# Optional display-metadata cache. This does NOT switch Sa-Token sessions to Redis.
# memory is the safe default; choose redis only after its address/password are configured and reachable.
# Existing user/permission/system-secret Spring caches remain in process memory.
tongligong-student-cloud.cache.type=${STUDENT_CLOUD_CACHE_TYPE:memory}
tongligong-student-cloud.cache.namespace=${STUDENT_CLOUD_CACHE_NAMESPACE:student-cloud}
tongligong-student-cloud.cache.metadata-ttl=${STUDENT_CLOUD_CACHE_TTL:120s}
# Aggregate dashboards may lag mutations by at most this short TTL (1-30s); authorization/runtime stay live.
tongligong-student-cloud.cache.overview-ttl=${STUDENT_CLOUD_OVERVIEW_CACHE_TTL:10s}
tongligong-student-cloud.cache.redis.host=${STUDENT_CLOUD_REDIS_HOST:127.0.0.1}
tongligong-student-cloud.cache.redis.port=${STUDENT_CLOUD_REDIS_PORT:6379}
tongligong-student-cloud.cache.redis.database=${STUDENT_CLOUD_REDIS_DATABASE:1}
tongligong-student-cloud.cache.redis.username=${STUDENT_CLOUD_REDIS_USERNAME:}
tongligong-student-cloud.cache.redis.password=${STUDENT_CLOUD_REDIS_PASSWORD:}
tongligong-student-cloud.cache.redis.ssl=${STUDENT_CLOUD_REDIS_SSL:false}
tongligong-student-cloud.cache.redis.timeout=${STUDENT_CLOUD_REDIS_TIMEOUT:800ms}
# auto uses Redis when cache.type=redis. closed blocks protected requests during Redis outages;
# local explicitly trades shared protection for a bounded process-local fallback (single backend only).
tongligong-student-cloud.rate-limit.type=${STUDENT_CLOUD_RATE_LIMIT_TYPE:auto}
tongligong-student-cloud.rate-limit.failure-mode=${STUDENT_CLOUD_RATE_LIMIT_FAILURE_MODE:closed}
tongligong-student-cloud.rate-limit.local-max-keys=${STUDENT_CLOUD_RATE_LIMIT_LOCAL_MAX_KEYS:10000}
# Only trust the actual Nginx socket peer/CIDRs. Empty means ignore all X-Forwarded-For headers.
tongligong-student-cloud.rate-limit.trusted-proxy-cidrs=${STUDENT_CLOUD_TRUSTED_PROXY_CIDRS:}
# Preserve the socket peer for the explicit proxy trust check (do not install a broad forwarded-header filter).
server.forward-headers-strategy=none
# Redis reads fall back to DB on failure. In redis mode, storage mutations fail closed if generation
# invalidation is unavailable; a post-commit failure explicitly reports saved data (do not submit again).

