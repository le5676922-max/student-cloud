# 本地OCR，不调用图片模型API；默认关闭，只用于没有文字层的PDF知识库资料。
tongligong-student-cloud.learning.ocr.enabled=${STUDENT_CLOUD_OCR_ENABLED:false}
tongligong-student-cloud.learning.ocr.executable=${STUDENT_CLOUD_OCR_EXECUTABLE:/usr/bin/tesseract}
tongligong-student-cloud.learning.ocr.language=${STUDENT_CLOUD_OCR_LANGUAGE:chi_sim+eng}
tongligong-student-cloud.learning.ocr.max-pages=${STUDENT_CLOUD_OCR_MAX_PAGES:10}
tongligong-student-cloud.learning.ocr.dpi=${STUDENT_CLOUD_OCR_DPI:120}
tongligong-student-cloud.learning.ocr.max-chars=${STUDENT_CLOUD_OCR_MAX_CHARS:60000}
tongligong-student-cloud.learning.ocr.page-timeout-seconds=${STUDENT_CLOUD_OCR_PAGE_TIMEOUT_SECONDS:15}
tongligong-student-cloud.learning.ocr.total-timeout-seconds=${STUDENT_CLOUD_OCR_TOTAL_TIMEOUT_SECONDS:90}
tongligong-student-cloud.learning.ocr.max-concurrent=${STUDENT_CLOUD_OCR_MAX_CONCURRENT:1}
