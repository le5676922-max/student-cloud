spring.application.name=cloud-platform
spring.profiles.default=local
server.address=${SC_BIND_ADDRESS:127.0.0.1}
server.port=${SC_PLATFORM_PORT:${SC_PORT:18101}}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.threads.max=24
server.tomcat.threads.min-spare=4
server.tomcat.max-connections=128
server.tomcat.accept-count=24
spring.sql.init.mode=never
spring.flyway.enabled=false
student-cloud.database.url=jdbc:h2:mem:student_cloud_platform;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
student-cloud.database.username=sa
student-cloud.database.password=
student-cloud.database.maximum-pool-size=4
student-cloud.web.allowed-origins=${SC_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}
student-cloud.services.internal-key=${SC_INTERNAL_KEY:}
student-cloud.registration.enabled=${SC_REGISTRATION_ENABLED:true}
student-cloud.password-reset.enabled=${SC_PASSWORD_RESET_ENABLED:true}
student-cloud.mail.enabled=${SC_MAIL_ENABLED:false}
student-cloud.mail.host=${SC_SMTP_HOST:smtp.qq.com}
student-cloud.mail.port=${SC_SMTP_PORT:465}
student-cloud.mail.username=${SC_SMTP_USERNAME:}
student-cloud.mail.password=${SC_SMTP_PASSWORD:}
student-cloud.mail.auth=${SC_SMTP_AUTH:true}
student-cloud.mail.ssl=${SC_SMTP_SSL:true}
student-cloud.mail.starttls=${SC_SMTP_STARTTLS:false}
spring.cloud.discovery.client.simple.instances.cloud-content[0].uri=${SC_CONTENT_URI:http://127.0.0.1:18102}
spring.cloud.loadbalancer.retry.enabled=false
spring.cloud.loadbalancer.cache.enabled=false
