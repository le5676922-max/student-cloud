spring.application.name=cloud-intelligence
spring.profiles.default=local
server.address=${SC_BIND_ADDRESS:127.0.0.1}
server.port=${SC_INTELLIGENCE_PORT:${SC_PORT:18103}}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.threads.max=24
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=128
server.tomcat.accept-count=16
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=5MB
spring.task.scheduling.pool.size=2
spring.sql.init.mode=never
spring.flyway.enabled=false
student-cloud.database.url=jdbc:h2:mem:student_cloud_intelligence;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
student-cloud.database.username=sa
student-cloud.database.password=
student-cloud.database.maximum-pool-size=4
student-cloud.services.internal-key=${SC_INTERNAL_KEY:}
student-cloud.web.allowed-origins=${SC_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}
spring.cloud.discovery.client.simple.instances.cloud-platform[0].uri=${SC_PLATFORM_URI:http://127.0.0.1:18101}
spring.cloud.discovery.client.simple.instances.cloud-content[0].uri=${SC_CONTENT_URI:http://127.0.0.1:18102}
spring.cloud.loadbalancer.retry.enabled=false
spring.cloud.loadbalancer.cache.enabled=false
student-cloud.ai.base-url=${SC_AI_BASE_URL:https://api.deepseek.com}
student-cloud.ai.model=${SC_AI_MODEL:deepseek-flash}
student-cloud.ai.key=${SC_AI_API_KEY:}
