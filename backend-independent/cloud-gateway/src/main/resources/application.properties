spring.application.name=cloud-gateway
spring.main.web-application-type=reactive
server.address=${SC_BIND_ADDRESS:127.0.0.1}
server.port=${SC_PORT:18093}
server.shutdown=graceful
server.error.include-message=never
server.error.include-stacktrace=never
spring.lifecycle.timeout-per-shutdown-phase=20s
student-cloud.gateway.allowed-origins=${SC_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}
student-cloud.services.internal-key=${SC_INTERNAL_KEY:}
student-cloud.gateway.trusted-proxy-ips=${SC_GATEWAY_TRUSTED_PROXY_IPS:}
student-cloud.gateway.platform-websocket-uri=${SC_PLATFORM_WS_URI:ws://127.0.0.1:18101}
spring.cloud.discovery.client.simple.instances.cloud-platform[0].uri=${SC_PLATFORM_URI:http://127.0.0.1:18101}
spring.cloud.discovery.client.simple.instances.cloud-content[0].uri=${SC_CONTENT_URI:http://127.0.0.1:18102}
spring.cloud.discovery.client.simple.instances.cloud-intelligence[0].uri=${SC_INTELLIGENCE_URI:http://127.0.0.1:18103}
spring.cloud.loadbalancer.retry.enabled=false
spring.cloud.loadbalancer.cache.enabled=false
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=2000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=90s
spring.cloud.gateway.server.webflux.httpclient.pool.max-connections=96
spring.cloud.gateway.server.webflux.httpclient.pool.acquire-timeout=2000
spring.cloud.gateway.server.webflux.httpclient.pool.max-idle-time=30s
spring.cloud.gateway.server.webflux.default-filters[0].name=DedupeResponseHeader
spring.cloud.gateway.server.webflux.default-filters[0].args.name=Access-Control-Allow-Origin Access-Control-Allow-Credentials
spring.cloud.gateway.server.webflux.default-filters[0].args.strategy=RETAIN_FIRST
resilience4j.circuitbreaker.instances.platformMetadata.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.platformMetadata.sliding-window-size=20
resilience4j.circuitbreaker.instances.platformMetadata.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.platformMetadata.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.platformMetadata.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.platformMetadata.permitted-number-of-calls-in-half-open-state=2
resilience4j.timelimiter.instances.platformMetadata.timeout-duration=3s
management.server.address=127.0.0.1
management.server.port=${SC_MANAGEMENT_PORT:19193}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
