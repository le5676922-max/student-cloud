name: student-cloud-microservices-b
# Node B: file/course I/O and assistant tasks, connected to node A only over VPC.
services:
  content:
    extends: {file: compose.services.yaml, service: content}
    ports: ["${SC_NODE_B_IP:?Set private ECS B address}:18102:18102"]
    environment:
      SC_PLATFORM_URI: http://${SC_NODE_A_IP:?Set private ECS A address}:18101
      SC_DB_URL: jdbc:mysql://${SC_NODE_A_IP:?Set private ECS A address}:3306/student_cloud_content?characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
  intelligence:
    extends: {file: compose.services.yaml, service: intelligence}
    ports: ["${SC_NODE_B_IP:?Set private ECS B address}:18103:18103"]
    environment:
      SC_PLATFORM_URI: http://${SC_NODE_A_IP:?Set private ECS A address}:18101
      SC_DB_URL: jdbc:mysql://${SC_NODE_A_IP:?Set private ECS A address}:3306/student_cloud_intelligence?characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    depends_on: {content: {condition: service_healthy}}
  redis:
    extends: {file: compose.services.yaml, service: redis}
volumes:
  content_tmp:
  redis_data:
