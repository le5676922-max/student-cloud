map $http_upgrade $cloud_connection { default upgrade; '' close; }
upstream student_cloud_gateway {
    server gateway:18093;
    keepalive 24;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    # No URI/query/body logging: WebSocket tickets and file paths are private.
    access_log off;
    # The frontend is published only on loopback. An optional host HTTPS edge overwrites X-Real-IP.
    set_real_ip_from ${SC_HTTPS_EDGE_PROXY_IP};
    real_ip_header X-Real-IP;
    real_ip_recursive off;
    client_max_body_size 51m;
    client_header_timeout 15s;
    client_body_timeout 60s;
    send_timeout 60s;
    keepalive_timeout 30s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz { default_type application/json; return 200 '{"status":"UP"}'; }
    location ~ ^/internal(?:/|$) { return 403; }
    location ~ /\. { return 404; }
    location = /index.html { add_header Cache-Control "no-store" always; }
    location = /student-cloud.config.json { add_header Cache-Control "no-store" always; }
    location ^~ /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }

    location = /ws/support {
        include /etc/nginx/student-cloud/proxy.inc;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cloud_connection;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 90s;
    }
    # The same /admin prefix contains SPA navigation and JSON APIs.
    location ~ ^/admin(?:/|$) {
        error_page 418 = @cloud_spa;
        if ($http_accept ~* "text/html") { return 418; }
        include /etc/nginx/student-cloud/proxy.inc;
    }
    location ~ ^/(api|user)(?:/|$) {
        include /etc/nginx/student-cloud/proxy.inc;
        # SSE is forwarded incrementally; never wait for a complete answer body.
        gzip off;
        add_header X-Accel-Buffering no always;
    }
    location @cloud_spa { try_files /index.html =404; }
    location / { try_files $uri $uri/ /index.html; }
}
