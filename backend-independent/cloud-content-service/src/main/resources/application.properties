spring.application.name=cloud-content
spring.profiles.default=local
server.address=${SC_BIND_ADDRESS:127.0.0.1}
server.port=${SC_CONTENT_PORT:${SC_PORT:18102}}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.threads.max=32
server.tomcat.threads.min-spare=4
server.tomcat.max-connections=128
server.tomcat.accept-count=32
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=51MB
spring.sql.init.mode=never
spring.flyway.enabled=false
student-cloud.database.url=jdbc:h2:mem:student_cloud_content;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
student-cloud.database.username=sa
student-cloud.database.password=
student-cloud.database.maximum-pool-size=4
student-cloud.web.allowed-origins=${SC_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}
student-cloud.services.internal-key=${SC_INTERNAL_KEY:}
student-cloud.storage.managed-root=${SC_MANAGED_STORAGE_ROOT:}
student-cloud.courses.private-root=${SC_COURSE_STORAGE_ROOT:}
spring.cloud.discovery.client.simple.instances.cloud-platform[0].uri=${SC_PLATFORM_URI:http://127.0.0.1:18101}
spring.cloud.loadbalancer.retry.enabled=false
spring.cloud.loadbalancer.cache.enabled=false
student-cloud.uploads.staging-root=${SC_UPLOAD_STAGING_ROOT:}
student-cloud.uploads.node-id=${SC_CONTENT_NODE_ID:content-local}
student-cloud.remote.master-key=${SC_STORAGE_MASTER_KEY:}
student-cloud.remote.allowed-endpoints=${SC_STORAGE_ALLOWED_ENDPOINTS:}
