root /usr/share/nginx/html;
index index.html;
server_tokens off;
access_log /var/log/nginx/access.log cloud;
# HTTP multipart 有额外字节，略高于后端 512MB 单文件/请求上限。
client_max_body_size 520m;
client_body_timeout 300s;
# 默认整文件上传流式转发；仅有限大小的续传分片覆盖为完整缓冲。
proxy_request_buffering off;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
location = /healthz { access_log off; default_type application/json; return 200 '{"status":"UP"}'; }
# 就绪检查只允许后端容器内部访问，浏览器不可访问，也不可回退成 SPA。
location ~ ^/internal(?:/|$) { return 404; }
location ~ /\. { return 404; }
location = /index.html { add_header Cache-Control "no-store" always; }
location = /student-cloud.config.json { add_header Cache-Control "no-store" always; }
location ^~ /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
# 必须排在通用 /api 正则之前；HTTP 和 HTTPS 共用本 routes，不能被通用代理遮蔽。
# 完整接收最多4MiB后才连接后端，不让慢速客户端占住后端8个分片I/O槽。
location ~ ^/api/uploads/resumable/[^/]+/chunks/[^/]+/?$ {
    client_max_body_size 4m;
    # 两次正文读取之间的空闲期限，不是整个上传必须15秒完成。
    client_body_timeout 15s;
    client_body_buffer_size 64k;
    client_body_temp_path /tmp/nginx-chunk-body 1 2;
    # 12 * 4MiB <= 48MiB，低于专用 /tmp 的64MiB tmpfs上限。
    limit_conn chunk_buffers_global 12;
    limit_conn chunk_buffers_ip 4;
    limit_conn_status 429;
    include /etc/nginx/student-cloud/proxy.conf;
    proxy_request_buffering on;
    proxy_buffering off;
}
# 流式 Agent 响应不缓存、不聚合，避免等回答结束才一次显示。
location ^~ /api/ai/chat/ {
    include /etc/nginx/student-cloud/proxy.conf;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    add_header X-Accel-Buffering no always;
}
location ~ ^/admin(?:/|$) {
    if ($admin_navigation) { rewrite ^ /index.html last; }
    include /etc/nginx/student-cloud/proxy.conf;
}
# /open115/url 是下载路由，不应误交给 Vue。
location ~ ^/(api|user|file|pd|d|s|directlink|sso|onlyOffice|onedrive|onedirve|gd|s3|sharepoint|115|open115)(?:/|$) {
    include /etc/nginx/student-cloud/proxy.conf;
    proxy_buffering off;
}
# 自定义直链前缀时，需要在上面的代理列表增加该前缀并重建前端。
location / { try_files $uri $uri/ /index.html; }
