packages:
  - '.'

allowBuilds:
  '@parcel/watcher': true
  canvas: true
  core-js: true
  esbuild: true
  vue-demi: true

# Narrow, compatible patched ranges; do not downgrade unrelated major versions.
minimumReleaseAgeExclude:
  - element-plus@2.14.7

overrides:
  '@babel/core@>=7 <7.29.1': ^7.29.1
  '@babel/helpers@>=7 <7.26.10': ^7.26.10
  '@babel/runtime@>=7 <7.26.10': ^7.26.10
  '@babel/traverse@>=7 <7.23.2': ^7.23.2
  # Keep Vue's compiler, runtime and SSR helpers on the same security-patched release.
  '@vue/compiler-core@>=3 <3.5.42': 3.5.42
  '@vue/compiler-dom@>=3 <3.5.42': 3.5.42
  '@vue/compiler-sfc@>=3 <3.5.42': 3.5.42
  '@vue/compiler-ssr@>=3 <3.5.42': 3.5.42
  '@vue/reactivity@>=3 <3.5.42': 3.5.42
  '@vue/runtime-core@>=3 <3.5.42': 3.5.42
  '@vue/runtime-dom@>=3 <3.5.42': 3.5.42
  '@vue/server-renderer@>=3 <3.5.42': 3.5.42
  '@vue/shared@>=3 <3.5.42': 3.5.42
  'ajv@>=6 <6.14.0': ^6.14.0
  'brace-expansion@>=1 <1.1.21': ^1.1.21
  'brace-expansion@>=2 <2.1.7': ^2.1.7
  'braces@>=3 <3.0.3': ^3.0.3
  'browserslist@>=4 <4.28.7': ^4.28.7
  'cross-spawn@>=7 <7.0.5': ^7.0.5
  'decode-uri-component@<0.5.0': ^0.5.0
  'flatted@>=3 <3.4.2': ^3.4.2
  'handlebars@>=4 <4.7.10': 4.7.10
  'immutable@>=5 <5.1.8': ^5.1.8
  'js-yaml@>=4 <4.3.2': ^4.3.2
  'lodash-es@>=4 <4.17.24': ^4.17.24
  'lodash@>=4 <4.17.24': ^4.17.24
  'micromatch@>=4 <4.0.8': ^4.0.8
  'minimatch@>=3 <3.1.4': ^3.1.4
  'minimatch@>=9 <9.0.7': ^9.0.7
  'nanoid@>=4 <5.1.16': ^5.1.16
  'picomatch@>=2 <2.3.2': ^2.3.2
  'picomatch@>=4 <4.0.4': ^4.0.4
  'postcss@>=7 <7.0.36': ^7.0.36
  'postcss@>=8 <8.5.23': ^8.5.28
  'rollup@>=3 <3.30.0': ^3.30.0
  'semver@>=5 <5.7.2': ^5.7.2
  'semver@>=6 <6.3.1': ^6.3.1
  'semver@>=7 <7.5.2': ^7.5.2
  'serialize-javascript@>=6 <7.0.5': ^7.0.5
  'shell-quote@>=1 <1.8.5': ^1.8.5
  'source-map-js@>=1 <1.2.2': 1.2.2
  'svgo@>=2 <2.8.4': ^2.8.4
  'tmp@<0.2.6': ^0.2.6
  'word-wrap@<1.2.4': ^1.2.4
  'webpack@>=5 <5.104.1': ^5.104.1
  'yaml@>=2 <2.8.3': ^2.8.3

peerDependencyRules:
  ignoreMissing:
    - rollup
    - markdown-it
    - '@types/markdown-it'
