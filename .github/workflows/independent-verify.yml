name: Verify current independent project

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "backend-independent/**"
      - "frontend/**"
      - ".github/workflows/independent-verify.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend-independent/**"
      - "frontend/**"
      - ".github/workflows/independent-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: independent-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend-independent/**/pom.xml
      - name: Verify all independent backend modules
        run: mvn -B -f backend-independent/pom.xml verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-backend-test-results
          path: backend-independent/**/target/surefire-reports/
          retention-days: 7

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test:unit
      - run: node scripts/check-design-contract.mjs
      - run: pnpm run build
