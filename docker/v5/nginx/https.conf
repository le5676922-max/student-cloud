# V5 dormant template: activate only after install/tests and explicit domain cutover approval.
map "$request_method:$http_accept" $admin_navigation {
    default 0;
    ~*^(GET|HEAD):.*text/html 1;
}
log_format cloud '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';
limit_conn_zone $server_name zone=chunk_buffers_global:1m;
limit_conn_zone $binary_remote_addr zone=chunk_buffers_ip:1m;
upstream cloud_backend {
    least_conn;
    server backend:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}
server {
    listen 8080;
    server_name jialechatweb.xin;
    include /etc/nginx/student-cloud/acme.conf;
    location = /healthz { access_log off; default_type application/json; return 200 '{"status":"UP"}'; }
    location / { return 301 https://jialechatweb.xin$request_uri; }
}
server {
    listen 8443 ssl;
    server_name jialechatweb.xin;
    ssl_certificate /etc/letsencrypt/live/jialechatweb.xin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jialechatweb.xin/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    include /etc/nginx/student-cloud/acme.conf;
    include /etc/nginx/student-cloud/routes.conf;
}
