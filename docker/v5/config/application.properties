tongligong-student-cloud.log.path=/data/logs
tongligong-student-cloud.db.path=/data/home/.student-cloud/db/student-cloud
tongligong-student-cloud.workspace-storage.root=/data/workspaces
tongligong-student-cloud.courses.storage-root=/data/course-materials
# Bind the two deployment-specific variables to the actual application properties.
tongligong-student-cloud.courses.max-owner-bytes=${STUDENT_CLOUD_COURSE_MAX_OWNER_BYTES:2147483648}
tongligong-student-cloud.courses.max-total-bytes=${STUDENT_CLOUD_COURSE_MAX_TOTAL_BYTES:6442450944}
spring.servlet.multipart.max-file-size=512MB
spring.servlet.multipart.max-request-size=512MB
server.forward-headers-strategy=none
tongligong-student-cloud.ai.enabled=${AI_ENABLED:false}
tongligong-student-cloud.ai.api-key=${DEEPSEEK_API_KEY:}
